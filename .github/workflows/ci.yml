name: Node.js Unit Tests
 
on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - 'develop'

jobs:
  label_issue:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.MY_TOKEN }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          gh issue edit $ISSUE_URL --add-label "triage"