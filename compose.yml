version: '3.8'

services:
  react-native-app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "8081:8081"
    environment:
      - NODE_ENV=development
      - EXPO_DEBUG=true
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      # Force polling inside Docker for hot-reloading to trigger properly
      - CHOKIDAR_USEPOLLING=true
      - METRO_ENABLE_POLLING=true
    stdin_open: true
    tty: true
